name: Qoder Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  qoder-assistant:
    if: |
      contains(github.event.comment.body, '@qoder') &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arguments
        id: build_args
        # Untrusted event fields are passed via env, never interpolated into
        # the shell script, so comment text cannot inject commands.
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REVIEW_ID: ${{ github.event.comment.pull_request_review_id }}
          IN_REPLY_TO_ID: ${{ github.event.comment.in_reply_to_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
        run: |
          # Random delimiter so a crafted comment body cannot terminate the
          # value early and inject additional step outputs.
          delimiter="QODER_ARGS_$(openssl rand -hex 16)"

          {
            echo "args<<${delimiter}"
            printf 'REPO: %s\n' "$REPOSITORY"
            printf 'REQUEST_SOURCE: %s\n' "$EVENT_NAME"
            printf 'THREAD_ID: %s\n' "$COMMENT_NODE_ID"
            printf 'COMMENT_ID: %s\n' "$COMMENT_ID"
            printf 'AUTHOR: %s\n' "$COMMENT_AUTHOR"
            printf 'BODY: %s\n' "$COMMENT_BODY"
            printf 'URL: %s\n' "$COMMENT_URL"
            printf 'IS_PR: %s\n' "$IS_PR"
            printf 'ISSUE_OR_PR_NUMBER: %s\n' "${ISSUE_NUMBER:-$PR_NUMBER}"
            if [ -n "$REVIEW_ID" ]; then
              printf 'REVIEW_ID: %s\n' "$REVIEW_ID"
            fi
            if [ -n "$IN_REPLY_TO_ID" ]; then
              printf 'REPLY_TO_COMMENT_ID: %s\n' "$IN_REPLY_TO_ID"
            fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Qoder Assistant
        uses: QoderAI/qoder-action@v0
        with:
          qoder_personal_access_token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          prompt: |
            /assistant
            ${{ steps.build_args.outputs.args }}
            OUTPUT_LANGUAGE:English
